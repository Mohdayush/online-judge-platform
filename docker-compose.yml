services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://codearena:codearena@postgres:5432/codearena
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-only-change-me
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://codearena:codearena@postgres:5432/codearena
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-only-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Development only: lets the worker launch execution containers.
    # Never expose this socket to an untrusted production workload.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codearena
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: codearena
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codearena -d codearena"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
